<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title></title>
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      html, body { min-height: 100%; margin: 0; }
      body { min-height: 100vh; overflow: hidden; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif; }
      .entry { min-height: 100vh; position: relative; width: 100%; }
      .panel { min-height: 100vh; position: absolute; top: 0; width: 50%; }
      .panel--valen { background: #285a9f; left: 0; }
      .panel--kris { background: #c74634; right: 0; }
      .octocat-link { color: #fff; display: block; left: 50%; position: absolute; top: 50%; transform: translate(-50%, -50%); transition: transform 180ms ease, opacity 180ms ease; z-index: 2; }
      .octocat-link:hover, .octocat-link:focus-visible { color: #fff; opacity: 0.84; transform: translate(-50%, -50%) scale(1.06); }
      .octocat-link:focus-visible { outline: 3px solid rgba(255, 255, 255, 0.8); outline-offset: 8px; }
      .github-mark { fill: currentColor; height: clamp(5rem, 12vw, 8rem); width: clamp(5rem, 12vw, 8rem); }
      .door-handle { align-items: center; background: rgba(255, 255, 255, 0.12); border: 1px solid rgba(255, 255, 255, 0.48); border-radius: 999px; display: flex; height: clamp(4rem, 8vw, 6rem); justify-content: center; position: absolute; top: 50%; transform: translateY(-50%); transition: background 180ms ease, transform 180ms ease; width: clamp(4rem, 8vw, 6rem); z-index: 3; }
      .door-handle:hover, .door-handle:focus-visible { background: rgba(255, 255, 255, 0.24); }
      .door-handle:focus-visible { outline: 3px solid rgba(255, 255, 255, 0.85); outline-offset: 6px; }
      .door-handle--valen { left: clamp(0.8rem, 3vw, 2.5rem); }
      .door-handle--kris { right: clamp(0.8rem, 3vw, 2.5rem); }
      .imperial-seal { filter: brightness(0) invert(1); height: 62%; width: 62%; }
      [data-host="valen"] .door-handle, [data-host="kris"] .door-handle { display: none; }
      [data-host="valen"] .panel--kris, [data-host="kris"] .panel--valen { display: none; }
    </style>
  </head>
  <body>
    <main class="entry">
      <section class="panel panel--valen" aria-label="valen.tine 배경"></section>
      <section class="panel panel--kris" aria-label="kris.tine 배경"></section>
      <a class="door-handle door-handle--valen" href="https://valen.tine.im/" aria-label="valen.tine.im 열기">
        <img class="imperial-seal" src="/images/Imperial_Seal_of_the_Korean_Empire.svg" alt="" />
      </a>
      <a class="door-handle door-handle--kris" href="https://kris.tine.im/" aria-label="kris.tine.im 열기">
        <img class="imperial-seal" src="/images/Imperial_Seal_of_the_Korean_Empire.svg" alt="" />
      </a>
      <a class="octocat-link" href="https://github.com/kris-atelier" aria-label="GitHub에서 kris-atelier 프로필 열기">
        <svg class="github-mark" viewBox="0 0 24 24" role="img" aria-hidden="true">
          <path d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.084-.729.084-.729 1.205.084 1.84 1.237 1.84 1.237 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12Z" />
        </svg>
      </a>
    </main>
    <script>
      const host = window.location.hostname.toLowerCase();
      document.documentElement.dataset.host = host === "kris.tine.im" ? "kris" : host === "valen.tine.im" ? "valen" : "root";
    </script>
  </body>
</html>
