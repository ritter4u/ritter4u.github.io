<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title></title>
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      html, body { min-height: 100%; margin: 0; }
      body { min-height: 100vh; overflow: hidden; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif; }
      .entry { display: flex; min-height: 100vh; width: 100%; }
      .panel { align-items: center; display: flex; flex: 1 1 50%; justify-content: center; min-height: 100vh; }
      .panel--valen { background: #c74634; }
      .panel--kris { background: #285a9f; }
      .panel__center { align-items: center; display: flex; flex-direction: column; gap: 1.25rem; justify-content: center; text-align: center; }
      .panel__emblem { display: block; height: clamp(4.5rem, 12vw, 8rem); width: clamp(4.5rem, 12vw, 8rem); }
      .panel__domain { color: rgba(255, 255, 255, 0.92); font-size: clamp(0.68rem, 1.2vw, 0.86rem); letter-spacing: 0.18em; line-height: 1.4; text-indent: 0.18em; }
      @media (max-width: 640px) { .entry { flex-direction: column; } .panel { min-height: 50vh; } }
      [data-host="valen"] .panel--kris, [data-host="kris"] .panel--valen { display: none; }
    </style>
  </head>
  <body>
    <main class="entry">
      <section class="panel panel--valen" aria-label="valen.tine"><div class="panel__center"><img class="panel__emblem" src="/images/Imperial_Seal_of_the_Korean_Empire.svg" alt="" /><div class="panel__domain">valen.tine.im</div></div></section>
      <section class="panel panel--kris" aria-label="kris.tine"><div class="panel__center"><img class="panel__emblem" src="/images/Imperial_Seal_of_the_Korean_Empire.svg" alt="" /><div class="panel__domain">kris.tine.im</div></div></section>
    </main>
    <script>
      const host = window.location.hostname.toLowerCase();
      document.documentElement.dataset.host = host === "kris.tine.im" ? "kris" : host === "valen.tine.im" ? "valen" : "root";
    </script>
  </body>
</html>
